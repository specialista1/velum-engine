<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELUM — Ambiente de teste (mock)</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #101B2D; }
  h1 { font-size: 1.4rem; }
  .warn { background: #F1E4C6; border-left: 3px solid #A9791F; padding: 12px 16px; font-size: 0.9rem; margin-bottom: 24px; }
  label { display: block; margin-top: 14px; font-size: 0.85rem; color: #46566B; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 20px; padding: 10px 18px; background: #A9791F; color: white; border: none; border-radius: 3px; cursor: pointer; }
  pre { background: #101B2D; color: #EEF1EA; padding: 16px; margin-top: 20px; border-radius: 4px; overflow-x: auto; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>VELUM — ambiente de teste</h1>
  <div class="warn">Este ambiente usa um NegotiationDesk ilusório (mock). Os números não têm base fiscal real — servem apenas para validar o deploy.</div>

  <label>SKU<input id="sku" value="SKU-X342"></label>
  <label>Custo atual (R$)<input id="custo_atual" type="number" value="75"></label>
  <label>Preço atual (R$)<input id="preco_atual" type="number" value="122.50"></label>
  <label>Margem histórica (0 a 1)<input id="margem_historica" type="number" step="0.01" value="0.35"></label>
  <label>Volume anual<input id="volume_anual" type="number" value="1500"></label>
  <label>Ano<input id="ano" value="2029"></label>

  <button onclick="calcular()">Calcular âncoras</button>
  <pre id="output">O resultado aparece aqui.</pre>

  <script>
    async function calcular() {
      const payload = {
        sku: document.getElementById('sku').value,
        custo_atual: parseFloat(document.getElementById('custo_atual').value),
        preco_atual: parseFloat(document.getElementById('preco_atual').value),
        margem_historica: parseFloat(document.getElementById('margem_historica').value),
        volume_anual: parseFloat(document.getElementById('volume_anual').value),
        ano: document.getElementById('ano').value
      };
      const out = document.getElementById('output');
      out.textContent = 'Calculando...';
      try {
        const res = await fetch('/api/negotiation/product', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = 'Erro: ' + e.message;
      }
    }
  </script>
</body>
</html>
